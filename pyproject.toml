[project]
name = "doppel"
version = "0.1.0"
description = "doppel framework — file-based AI double: deterministic helpers (dates, tasks, ids, log, indexes, evolution)"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
