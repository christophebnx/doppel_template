# doppel configuration. `projects:` MUST stay the last top-level key (rewritten by scripts/project.py).
owner: À compléter            # the person doppel works for
domain: À compléter           # one line: the owner's job / field (e.g. « avocat en droit social », « chef de chantier »)
timezone: Europe/Brussels
language:
  technical: en     # CLAUDE.md, agents, skills, templates, code
  data: fr          # tasks, brain, log, questions, outbox (template headings are French: translate them if you change it)
executors: []       # extra task executors besides `me` and `doppel` (e.g. [claude-code, assistant])
capacity:
  estimate_correction: 1.0  # learned from actual_h / estimate_h (updated by /consolidate via scripts/calibrate.py)
transcription:
  model: small            # faster-whisper model (optional extra: uv sync --extra audio)
  language: fr
climate:                  # weather-constrained tasks (task fields `climate` + `location`; scripts/weather.py)
  work_hours: "08:00-18:00"   # when a weather-constrained slot may be placed
  work_days: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
  min_score: 0.6              # probability that the conditions hold; below it the slot is « risqué » and /today re-places it
  default_duration_h: 2       # slot length when the task has no estimate
  step_min: 30
  frost_c: 1.0                # « hors-gel » = air ≥ this temperature (°C) during the whole slot
  horizon_days: 7             # search range when the task has no deadline
  # forecast: Open-Meteo (free, no key, ≤ 16 days); only the place's coordinates rounded to ~1 km are sent
# places: where tasks happen (slug: {label, lat, lon}) — written by `weather.py place-add <slug> --query "<commune>"`
places: {}
evolution:                # self-improvement framework (see CLAUDE.md « Runs and retro » and evolution/)
  capture: true               # signals + runs
  review: weekly              # off | weekly | manual
  autonomy: propose           # off | propose | execute
  # propose : /evolve writes briefs as `proposed`; the owner approves (/evolve approve E-nnn, or status: approved)
  # execute : eligible briefs are set `approved` automatically and executed by /improve
  merge: pr                   # pr | auto  — auto: the agent merges if every condition passes
  auto_merge_max_risk: low    # low | medium   (high: never auto-merged)
  guards:
    max_briefs_per_week: 2
    max_files_changed: 8
    allowed_paths: [.claude/skills/, .claude/agents/, templates/, scripts/, tests/evals/scenarios/]
    require: [pytest, evals_no_regression]
    cooldown_days: 7          # no two changes of the same component within this window
    observe_days: 7
    auto_revert: true
    self_report_threshold: 3
    origin_weights: {user: 3, deterministic: 2, self-report: 1, ingestion: 0.5}
    evals_min_scenarios: 8    # execute / auto-merge refused below this harness size (and without a main reference run)
  severity_weights: {low: 1, medium: 2, high: 3}
  recency_half_life_days: 14  # signal weight halves every N days since last_seen
  estimate_overrun_ratio: 1.5 # actual_h / estimate_h above this on a done task → deterministic signal
projects: {}
